/*
  Пример 1. Развёртывание веб-сервиса.
  Права доступа к файлам записаны двоичными числами
  (биты rwx для владельца, группы и остальных).
*/

/* Вспомогательные константы (имена с "_" не выводятся) */
0b1000 -> _CPU_CORES;
0b10 -> _WORKERS_PER_CORE;
0b10000000000 -> _CONN_PER_WORKER;

0b1111110010000 -> HTTP_PORT;
^{_CPU_CORES * _WORKERS_PER_CORE} -> WORKERS;
^{WORKERS * _CONN_PER_WORKER} -> MAX_CONNECTIONS;

/* 0755 для каталогов и 0644 для конфигурационных файлов */
0b111101101 -> DIR_MODE;
0b110100100 -> FILE_MODE;

/* Порты экземпляров: HTTP_PORT, HTTP_PORT + 1, HTTP_PORT + 2 */
[^{HTTP_PORT}; ^{HTTP_PORT + 1}; ^{HTTP_PORT + 2}] -> INSTANCE_PORTS;
^{max(INSTANCE_PORTS) + 0b1100100} -> METRICS_PORT;

/* Разрешённые подсети: октеты IPv4 и длина маски */
[
  [[0b11000000; 0b10101000; 0b1; 0b0]; 0b11000];
  [[0b1010; 0b0; 0b0; 0b0]; 0b1000]
] -> ALLOWED_NETWORKS;

/* Номер шарда журнала (всего 3 шарда) вычисляется по номеру порта */
^{mod(HTTP_PORT, 0b11)} -> LOG_SHARD;
