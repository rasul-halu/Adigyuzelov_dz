/*
  Пример 2. Контроллер умной теплицы.
  Зоны полива, расписание и климатические пороги.
*/

0b1010 -> _BASE_MINUTES;
0b11000 -> _HOURS_IN_DAY;

0b11000 -> TARGET_TEMP;
^{TARGET_TEMP - 0b100} -> NIGHT_TEMP;
^{TARGET_TEMP + 0b110} -> ALARM_TEMP;

/* Дни полива битовой маской: пн..пт = 0b0011111 */
0b0011111 -> WATERING_DAYS_MASK;

/* Часы полива и вечерний полив через 12 часов после утреннего */
0b110 -> MORNING_HOUR;
^{mod(MORNING_HOUR + 0b1100, _HOURS_IN_DAY)} -> EVENING_HOUR;
[^{MORNING_HOUR}; ^{EVENING_HOUR}] -> WATERING_HOURS;

/* Длительность полива по зонам: томаты, огурцы, зелень */
[
  ^{_BASE_MINUTES * 0b11};
  ^{_BASE_MINUTES * 0b10};
  ^{_BASE_MINUTES}
] -> ZONE_MINUTES;
^{max(ZONE_MINUTES)} -> LONGEST_ZONE_MINUTES;

/* Датчики влажности: [номер зоны; [нижний порог; верхний порог]] */
[
  [0b1; [0b111100; 0b1010000]];
  [0b10; [0b110010; 0b1000110]];
  [0b11; [0b101000; 0b111100]]
] -> HUMIDITY_SENSORS;
